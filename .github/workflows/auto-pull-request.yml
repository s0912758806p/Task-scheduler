# Opens a PR <branch> → dev for every pushed feature branch, using the bot PAT (BOT_PAT_TOKEN) so
# the PR is authored by the bot and auto-pr-maintenance.yml can approve/auto-merge it.
# Checkout uses the built-in GITHUB_TOKEN (reading the repo needs no PAT). If BOT_PAT_TOKEN is
# missing or rejected (expired/revoked), the job logs a warning and skips PR creation instead of
# failing — rotate the secret to bring auto-PRs back.
name: Auto Pull Request
on:
  push:
    branches-ignore:
      - dev
      - main
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pull-request:
    if: |
      github.event_name == 'push' && 
      !contains(github.actor, 'Gr925-auto-bot-project')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Bot Token
        id: bot-token
        run: |
          if gh api "repos/${{ github.repository }}" --silent 2>/dev/null; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning title=BOT_PAT_TOKEN::BOT_PAT_TOKEN is missing or invalid (expired/revoked); skipping auto PR. Rotate the repository secret to re-enable it."
          fi
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT_TOKEN }}

      - name: Extract Branch Info
        id: branch-info
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          if [[ $BRANCH_NAME =~ v([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(echo $BRANCH_NAME | sed -E 's/.*[-/]([^-/]+)$/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get Last Committer
        id: last-commit
        run: |
          echo "name=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "email=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT

      - name: Check if PR Exists
        if: steps.bot-token.outputs.ok == 'true'
        id: check-pr
        run: |
          PR_EXISTS=$(gh pr list --repo ${{ github.repository }} --head ${{ github.ref_name }} --base dev --json number --jq 'length')
          echo "pr_exists=$([ "$PR_EXISTS" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT_TOKEN }}

      - name: Create Pull Request
        if: steps.bot-token.outputs.ok == 'true' && steps.check-pr.outputs.pr_exists == 'false'
        id: open-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_PAT_TOKEN }}
          commit-message: "[PR-BOT] Auto PR from ${{ github.ref_name }}"
          branch: ${{ github.ref_name }}
          base: dev
          title: "${{ steps.branch-info.outputs.branch_name }} by ${{ steps.last-commit.outputs.name }}"
          body: |
            ## Automatic Pull Request from ${{ github.ref_name }}

            Original Author: ${{ steps.last-commit.outputs.name }}
            Original Email: ${{ steps.last-commit.outputs.email }}
            Branch: ${{ steps.branch-info.outputs.branch_name }}
            Version/ID: ${{ steps.branch-info.outputs.version }}

            [View commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          committer: PR-BOT <pr-bot@users.noreply.github.com>
          author: ${{ steps.last-commit.outputs.name }} <${{ steps.last-commit.outputs.email }}>
          signoff: true
          labels: |
            automated pr
            ${{ steps.branch-info.outputs.branch_name }}
